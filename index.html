<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>150 Days Challenge</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <header class="topbar">
    <div class="topbar-left">
      <button id="sidebarToggle" class="icon-btn mobile-only" title="Toggle sidebar"
        aria-label="Toggle sidebar">☰</button>
      <button id="homeBtn" class="brand" title="Dashboard">
        <span class="brand-dot"></span>
        <span>150 Days Challenge</span>
      </button>
    </div>

    <div class="topbar-center">
      <nav class="mode-nav" aria-label="Primary sections">
        <button class="mode-btn active" data-mode="dashboard">📊 Dashboard</button>
        <button class="mode-btn" data-mode="roadmap">🗺️ Roadmap</button>
        <button class="mode-btn" data-mode="concepts">📚 Concepts <span id="conceptsCount"
            class="count-pill">0</span></button>
        <button class="mode-btn" data-mode="contests">🏆 Contest Tracker <span id="contestsCount"
            class="count-pill">0</span></button>
      </nav>
    </div>

    <div class="topbar-right">
      <button id="themeBtn" class="icon-btn" title="Toggle light/dark theme" aria-label="Toggle theme">☀️</button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <!-- Roadmap sidebar controls -->
      <div id="roadmapControls" class="sidebar-controls">
        <div class="search-box">
          <input id="searchInput" type="search" placeholder="Search questions, categories, weeks..."
            autocomplete="off" />
        </div>

        <div class="filter-row" id="typeFilters">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="dsa">DSA</button>
          <button class="chip" data-filter="design">Design</button>
          <button class="chip" data-filter="behavioral">Behavioral</button>
          <button class="chip" data-filter="solved">Solved</button>
          <button class="chip" data-filter="notes">Has Notes</button>
          <button class="chip" data-filter="todo">Todo</button>
        </div>

        <div class="filter-row diff-row" id="diffFilters">
          <span class="filter-label">Difficulty:</span>
          <button class="chip active" data-diff="all">All</button>
          <button class="chip diff-e" data-diff="E">Easy</button>
          <button class="chip diff-m" data-diff="M">Med</button>
          <button class="chip diff-h" data-diff="H">Hard</button>
        </div>
      </div>

      <!-- Concepts sidebar controls -->
      <div id="conceptsControls" class="sidebar-controls hidden">
        <div class="search-box">
          <input id="conceptSearchInput" type="search" placeholder="Search concepts & learnings..."
            autocomplete="off" />
        </div>
      </div>

      <div id="treeContainer" class="tree-container">
        <div class="loading-msg">Loading roadmap...</div>
      </div>
    </aside>

    <main id="mainContent" class="main-content">
      <div id="dashboardView" class="dashboard-view"></div>
      <div id="problemView" class="problem-view hidden"></div>
      <div id="conceptView" class="problem-view hidden"></div>
      <div id="contestView" class="dashboard-view hidden"></div>
    </main>
  </div>

  <script src="./app.js"></script>
</body>

</html>
